services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: sh -c "npx prisma db push && npm run start"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: change-this-production-secret
      DATABASE_URL: postgresql://smart_user:smart_password@database:5432/smart_resources?schema=public
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_resources
      POSTGRES_USER: smart_user
      POSTGRES_PASSWORD: smart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_user -d smart_resources"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
